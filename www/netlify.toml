[dev]
framework = "#custom"
command = "pnpm run dev"
targetPort = 5173
autoLaunch = false

[build]
command = "bash scripts/netlify-build.sh"
publish = "www/dist"

[build.processing.html]
pretty_urls = true

[[redirects]]
from = "/404"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/404.html"
to = "/404.html"
status = 404
force = true

[functions]
directory = "www/netlify/functions"
external_node_modules = ["@jat/subconverter-wasm"]
