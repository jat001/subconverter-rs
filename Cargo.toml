[package]
name = "subconverter"
version = "0.2.36"
edition = "2021"
description = "A more powerful utility to convert between proxy subscription format"
license = "GPL-3.0+"
repository = "https://github.com/lonelam/subconverter-rs"

[lib]
name = "libsubconverter"
crate-type = ["cdylib", "rlib"]

[features]
default = []
web-api = ["actix-web"]
js-runtime = ["rquickjs"]

[[bin]]
name = "subconverter"
required-features = ["web-api"]

[dependencies]
base64 = "0.23.1"
configparser = "3.3.0"
lazy_static = "1.5.0"
log = "0.4.34"
regex = { version = "1.13.1", features = ["unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6+spec-1.1.0"
url = "2.5.8"
urlencoding = "2.1.3"
linked-hash-map = "0.5.6"
uuid = "1.26.1"
actix-web = { version = "4.15.0", optional = true }
once_cell = "1.21.4"
env_logger = "0.11.11"
serde_ini = "0.2.0"
yaml_serde = "0.10.7"
md-5 = "0.11"
clap = { version = "4.6.6", features = ["derive"] }
minijinja = "2.24.0"
bitflags = "2.13.2"
futures = "0.3.34"
thiserror = "2.0.20"
serde_bytes = "0.11.19"
anyhow = "1.0.104"
case_insensitive_string = "0.2.11"

# Re-add WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
serde-wasm-bindgen = "0.6.5"
tokio = { version = "1.53.1", features = ["rt", "sync", "io-util"] }
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "console",
    "Storage",
] }
console_log = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "0.13.0", optional = true }
awc = { version = "3.8.2", features = ["rustls"] }
tokio = { version = "1.53.1", features = [
    "rt",
    "fs",
    "sync",
    "io-util",
    "macros",
] }

[dev-dependencies]
tempfile = "3.27.0"
actix-web = "4.15.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winreg", "winerror", "minwindef"] }
