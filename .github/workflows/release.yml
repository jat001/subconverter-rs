name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pre.*'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a draft Release (leave unchecked to build candidate artifacts only)'
        type: boolean
  repository_dispatch:
    types: [trigger-native-release]

concurrency: 
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wasm_build:
    name: WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine Version
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: bash scripts/release-version.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm install -g pnpm@12
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build from source
        run: bash scripts/workers-build.sh
      - name: Package WASM and crate
        run: |
          mkdir -p target/release-assets
          pnpm --dir pkg pack --out ../target/release-assets/subconverter-wasm-%v.tgz
          cargo package --locked
          cp target/package/subconverter-rs-*.crate target/release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: target/release-assets/
      - name: Draft release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          files: target/release-assets/*
          tag_name: v${{ env.RELEASE_VERSION }}
          draft: true

  linux_build:
    strategy:
      matrix:
        include:
          - arch: x86
            artifact: subconverter-linux-x86
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - arch: amd64
            artifact: subconverter-linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: armv7
            artifact: subconverter-linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - arch: aarch64
            artifact: subconverter-linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Determine Version
      shell: bash
      env:
        REQUESTED_VERSION: ${{ github.event.client_payload.version }}
      run: bash scripts/release-version.sh

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - uses: Swatinem/rust-cache@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev
    
    - name: Install cross
      run: cargo install cross
      
    - name: Build with cross
      run: cross build --release --features=web-api${{ matrix.arch == 'amd64' && ',js-runtime' || '' }} --target ${{ matrix.target }}
      
    - name: Prepare artifact
      run: |
        mkdir -p subconverter/
        cp target/${{ matrix.target }}/release/subconverter subconverter/
        cp -r base/* subconverter/
        
    - name: Package Release
      run: tar czf ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.tar.gz subconverter

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }} # Append version to artifact name for clarity
        path: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.tar.gz

    - name: Draft Release
      # Run for tags or trigger-native-release event
      if: github.event_name != 'workflow_dispatch' || inputs.publish
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.tar.gz
        # Explicitly set tag_name for dispatch events, otherwise it defaults to github.ref (which is correct for tag pushes)
        tag_name: v${{ env.RELEASE_VERSION }}
        draft: true

  macos_build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            artifact: subconverter-macos-x86_64
            # macos-13 (the last plain Intel image) was retired; GitHub
            # provides macos-15-intel as the transitional Intel runner
            os: macos-15-intel
            target: x86_64-apple-darwin
          - arch: aarch64
            artifact: subconverter-macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.arch }} Build
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Determine Version
      shell: bash
      env:
        REQUESTED_VERSION: ${{ github.event.client_payload.version }}
      run: bash scripts/release-version.sh

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        
    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --features=web-api,js-runtime --target ${{ matrix.target }}
      
    - name: Prepare artifact
      run: |
        mkdir -p subconverter/
        cp target/${{ matrix.target }}/release/subconverter subconverter/
        cp -r base/* subconverter/
        
    - name: Package Release
      run: tar czf ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.tar.gz subconverter

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }} # Append version to artifact name
        path: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.tar.gz

    - name: Draft Release
      if: github.event_name != 'workflow_dispatch' || inputs.publish
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.tar.gz
        tag_name: v${{ env.RELEASE_VERSION }}
        draft: true
  
  windows_build:
    strategy:
      matrix:
        include:
          - arch: x86
            artifact: subconverter-windows-x86
            target: i686-pc-windows-msvc
          - arch: amd64
            artifact: subconverter-windows-amd64
            target: x86_64-pc-windows-msvc
    runs-on: windows-latest
    name: Windows ${{ matrix.arch }} Build
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Determine Version
      shell: bash
      env:
        REQUESTED_VERSION: ${{ github.event.client_payload.version }}
      run: bash scripts/release-version.sh

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        
    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: |
        cargo build --release --features=web-api${{ matrix.arch == 'amd64' && ',js-runtime' || '' }} --target ${{ matrix.target }}
      
    - name: Prepare artifact
      shell: bash
      run: |
        mkdir -p subconverter/
        cp target/${{ matrix.target }}/release/subconverter.exe subconverter/
        cp -r base/* subconverter/
        
    - name: Package Release
      run: 7z a ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.7z subconverter/

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }} # Append version to artifact name
        path: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.7z

    - name: Draft Release
      if: github.event_name != 'workflow_dispatch' || inputs.publish
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.artifact }}-${{ env.RELEASE_VERSION }}.7z
        tag_name: v${{ env.RELEASE_VERSION }}
        draft: true
