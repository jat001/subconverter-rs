name: WASM Release

# Publishes only npm and crates.io using their configured OIDC trusted publishers.
# GitHub Releases and container publication are separate, explicitly authorized operations.

on:
  push:
    tags:
      - 'v*-attempt*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true
        type: string
      publish:
        description: 'Publish the verified version (leave unchecked to build and verify only)'
        type: boolean
  repository_dispatch:
    types: [trigger-wasm-release]

jobs:
  wasm_release:
    name: Release WASM Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine Version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: bash scripts/release-version.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@12

      # wasm-bindgen embeds wasm-host/dist/kv_bindings.js, which is committed; fail if it is stale
      - name: Build and test wasm-host bindings
        working-directory: wasm-host
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          git diff --exit-code -- dist || {
            echo "::error::wasm-host/dist is out of date; run 'pnpm build' in wasm-host and commit the result"
            exit 1
          }

      - name: Build release-profile Node and Workers packages
        run: bash scripts/workers-build.sh

      - name: Verify npm OIDC identity exchange
        run: node scripts/check-npm-oidc.mjs

      # npm >= 11.5.1 is required for OIDC trusted publishing
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies in pkg directory
        run: |
          cd pkg
          npm install
          cd ..

      # npm exchanges this GitHub workflow identity through its configured trusted publisher.
      # Skip existing versions so retrying cannot overwrite a published package.
      - name: Publish to npm
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          if npm view "@jat/subconverter-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "@jat/subconverter-wasm@${VERSION} already on npm, skipping publish"
            exit 0
          fi
          cd pkg
          npm publish

      - name: Authenticate with crates.io trusted publisher
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Verify packages without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          mkdir -p target/release-candidates
          pnpm --dir pkg pack --out ../target/release-candidates/subconverter-wasm-%v.tgz
          (cd pkg && npm publish --dry-run)
          cargo publish --dry-run --locked
          cargo package --locked
          cp target/package/subconverter-rs-*.crate target/release-candidates/

      - name: Upload candidate packages
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: registry-candidates
          path: target/release-candidates/

      - name: Publish to crates.io
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          if curl -sf -A "subconverter-rs-release-workflow" https://crates.io/api/v1/crates/subconverter-rs/versions | jq -e --arg v "$RELEASE_VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
            echo "subconverter-rs $RELEASE_VERSION already exists; skipping publish"
          else
            cargo publish --locked
          fi
