name: WASM Release

# Version-tag publication orchestrator. Manual runs only build and verify.
# The workflow filename is bound to both registries' configured trusted publishers.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pre.*'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Source version to verify without publishing (without v prefix)'
        required: true
        type: string

jobs:
  wasm_release:
    name: Release WASM Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine Version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash scripts/release-version.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install pnpm
        run: npm install -g pnpm@12

      # wasm-bindgen embeds wasm-host/dist/kv_bindings.js, which is committed; fail if it is stale
      - name: Build and test wasm-host bindings
        working-directory: wasm-host
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          git diff --exit-code -- dist || {
            echo "::error::wasm-host/dist is out of date; run 'pnpm build' in wasm-host and commit the result"
            exit 1
          }

      - name: Build release-profile Node and Workers packages
        run: bash scripts/workers-build.sh

      # npm >= 11.5.1 is required for OIDC trusted publishing
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Authenticate with crates.io trusted publisher
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Prepare final package artifacts
        run: |
          mkdir -p target/release-packages
          pnpm --dir pkg pack --out ../target/release-packages/subconverter-wasm-%v.tgz
          cargo package --locked
          cp target/package/subconverter-rs-*.crate target/release-packages/

      - name: Check package publication without uploading
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          npm publish "target/release-packages/subconverter-wasm-$RELEASE_VERSION.tgz" --dry-run
          cargo publish --dry-run --locked

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: registry-packages
          path: target/release-packages/

      # npm exchanges this GitHub workflow identity through its configured trusted publisher.
      # Skip existing versions so retrying cannot overwrite a published package.
      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          if npm view "@jat/subconverter-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "@jat/subconverter-wasm@${VERSION} already on npm, skipping publish"
            exit 0
          fi
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish "target/release-packages/subconverter-wasm-$RELEASE_VERSION.tgz" --tag next
          else
            npm publish "target/release-packages/subconverter-wasm-$RELEASE_VERSION.tgz"
          fi

      - name: Publish to crates.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          if curl -sf -A "subconverter-rs-release-workflow" https://crates.io/api/v1/crates/subconverter-rs/versions | jq -e --arg v "$RELEASE_VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
            echo "subconverter-rs $RELEASE_VERSION already exists; skipping publish"
          else
            cargo publish --locked
          fi

  native:
    name: Native release artifacts
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read

  containers:
    name: Container release artifacts
    needs: [wasm_release, native]
    uses: ./.github/workflows/build-docker.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  github_release:
    name: Publish GitHub Release
    needs: [wasm_release, native, containers]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/release-version.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: subconverter-*-${{ env.RELEASE_VERSION }}
          merge-multiple: true
          path: target/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: registry-packages
          path: target/release-assets
      - name: Read release notes from CHANGELOG
        run: |
          awk -v version="$RELEASE_VERSION" '
            /^## / {
              if (in_release_section) {
                exit
              }
              in_release_section = ($2 == version)
              next
            }
            in_release_section {
              print
            }
          ' CHANGELOG.md > target/release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: target/release-notes.md
          files: target/release-assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
