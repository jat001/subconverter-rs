name: Docker Build Multi-Arch

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v0.3.1)'
        required: true

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify source version
        run: |
          REQUESTED_VERSION="${VERSION#v}" bash scripts/release-version.sh
          if [ -z "$VERSION" ]; then echo "VERSION=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"; fi
      - name: Image names
        id: images
        run: |
          echo "names<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          fi
          echo EOF >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.images.outputs.names }}
          tags: type=raw,value=${{ env.VERSION }}-${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Test local image
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION-${{ matrix.arch }}"
          docker run --rm "$image" ./subconverter --version
          docker run --rm --entrypoint /bin/sh "$image" -c './subconverter --url "/sub?target=clash&list=true&url=ss%3A%2F%2FYWVzLTEyOC1nY206Y2FuZGlkYXRl%40example.com%3A443%23candidate-node" -o /tmp/result.yml && grep -q candidate-node /tmp/result.yml && grep -q example.com /tmp/result.yml'

  manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        env:
          ALSO_LATEST: ${{ !contains(github.ref_name, '-') }}
        run: |
          images=("ghcr.io/${GITHUB_REPOSITORY,,}")
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            images+=("$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY#*/}")
          fi
          for image in "${images[@]}"; do
            tags=(-t "$image:$VERSION")
            if [ "$ALSO_LATEST" = true ]; then tags+=(-t "$image:latest"); fi
            docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          done
